<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/review.css">
    <link rel="stylesheet" href="../css/review.css">
</head>

<body>
    <section class="quiz-review-container">
        <h2>Quiz Preview</h2>

        <p><strong>Title:</strong> <span id="quizTitle"></span></p>
        <p><strong>Category:</strong> <span id="quizCategory"></span></p>
        <p><strong>Level:</strong> <span id="quizLevel"></span></p>

        <hr>

        <form id="quizPreviewForm">
            <div id="questionsArea"></div>

            <div style="margin-top:2rem;">
                <button type="button" class="btn btn-secondary" onclick="history.back()">Back</button>
                <button type="button" class="btn" onclick="confirmQuiz()">Confirm Quiz</button>
            </div>
        </form>
    </section>
    <script src="../js/review.js"></script>
</body>

</html>
