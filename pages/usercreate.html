<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Quiz - TechQuiz</title>
    <link rel="stylesheet" href="../css/usercreate.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <!-- Quiz Creation Section -->
    <main class="create-quiz-container">
        <h1>Create Your Own Quiz</h1>
        <form id="quizForm" novalidate>
            <!-- Quiz Title -->
            <div class="form-group">
                <label for="quizTitle">Quiz Title</label>
                <input type="text" id="quizTitle" class="form-control" placeholder="Enter quiz title" required>
            </div>

            <!-- Quiz Category -->
            <div class="form-group">
                <label for="quizCategory">Category</label>
                <select id="quizCategory" class="form-control" required>
                    <option value="" disabled selected>Select a category</option>
                    <option value="html">HTML</option>
                    <option value="css">CSS</option>
                    <option value="javascript">JavaScript</option>
                    <option value="react">React.js</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <!-- Quiz Difficulty Level -->
            <div class="form-group">
                <label for="quizLevel">Difficulty Level</label>
                <select id="quizLevel" class="form-control" required>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>
            </div>

            <!-- Questions Container -->
            <section id="questionsContainer"></section>

            <!-- Add Question Button -->
            <button type="button" class="add-question" id="addQuestionBtn">
                <i class="fas fa-plus"></i> Add Question
            </button>

            <!-- Save Quiz Button -->
            <div class="form-group" style="margin-top: 24px;">
                <button type="submit" class="btn">
                    <i class="fas fa-save"></i> Save Quiz
                </button>
            </div>
        </form>
    </main>

    <script src="../js/usercreate.js"></script>
</body>

</html>
